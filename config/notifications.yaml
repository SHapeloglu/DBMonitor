notifications:
  - channel: smtp
    enabled: false
    threshold: "severity >= 3"
    smtp_host: <SMTP_SUNUCU>
    smtp_port: 587
    smtp_user: <GONDEREN_ADRES>
    smtp_password: changeme
    from: <GONDEREN_ADRES>
    to:
      - <ALICI_ADRES>

  - channel: slack_webhook
    enabled: false
    threshold: "severity >= 2"
    webhook_url: https://hooks.slack.com/services/XXX/YYY/ZZZ

  - channel: webhook
    enabled: false
    threshold: "severity >= 3"
    webhook_url: http://localhost:9000/alerts
    headers:
      Content-Type: application/json
      Authorization: Bearer changeme
