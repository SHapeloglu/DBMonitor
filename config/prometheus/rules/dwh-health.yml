groups:
  - name: dwh_health_alerts
    interval: 30s
    rules:

      - alert: DWHCriticalHealthIssue
        # Not: metrikte 'severity' etiketi yok; önem derecesi örnek değeridir (OK=0, WARNING=2, ERROR=3).
        expr: dwh_health_check == 3
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🚨 Kritik DWH Sağlık Sorunu — {{ $labels.kontrol_kodu }}"
          description: |
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}
            Kontrol: {{ $labels.kontrol_adi }}
            Kategori: {{ $labels.kategori }}
            Severity: 3 (Kritik)

      - alert: DWHSecurityThreat
        expr: dwh_health_check{kategori="guvenlik"} == 3
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "🔒 GÜVENLIK TEHDIDI — {{ $labels.kontrol_kodu }}"
          description: |
            Hassas veri koruması ihlali:
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}

      - alert: DWHPipelineBreakdown
        expr: dwh_health_check{kategori="pipeline"} == 3
        for: 10m
        labels:
          severity: critical
          category: pipeline
        annotations:
          summary: "⚠️ Pipeline Kırılması — {{ $labels.kontrol_kodu }}"
          description: |
            Veri yükleme başarısız:
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}

      - alert: DWHWarningIssue
        expr: dwh_health_check == 2
        for: 15m
        labels:
          severity: warning
          category: general
        annotations:
          summary: "⚠️ DWH Uyarısı — {{ $labels.kontrol_kodu }}"
          description: |
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}
            Kontrol: {{ $labels.kontrol_adi }}

      - alert: DWHMultipleCategoriesCritical
        # Kritik (değer 3) sorunu olan FARKLI kategori sayısı (seri sayısı değil).
        expr: count(count by (kategori) (dwh_health_check == 3)) > 3
        for: 10m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🔴 SİSTEM ÇAPI KRIZ"
          description: "{{ $value }} kategori'de kritik sorun"

      - alert: DWHAllAdaptersDown
        # count() boş vektörde 0 değil boş döner; seri yokluğu absent() ile yakalanır.
        expr: absent(dwh_health_check) or (up{job="dwh-metrics"} == 0)
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🔴 TÜM ADAPTER'LAR YANIT VERMİYOR"
          description: "Collector engine'de kritik sorun"
