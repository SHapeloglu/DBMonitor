groups:
  - name: dwh_health_alerts
    interval: 30s
    rules:

      - alert: DWHCriticalHealthIssue
        expr: dwh_health_check{severity="3"} > 0
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🚨 Kritik DWH Sağlık Sorunu — {{ $labels.kontrol_kodu }}"
          description: |
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}
            Kontrol: {{ $labels.kontrol_adi }}
            Kategori: {{ $labels.kategori }}
            Severity: 3 (Kritik)

      - alert: DWHSecurityThreat
        expr: dwh_health_check{kategori="guvenlik", severity="3"} > 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "🔒 GÜVENLIK TEHDIDI — {{ $labels.kontrol_kodu }}"
          description: |
            Hassas veri koruması ihlali:
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}

      - alert: DWHPipelineBreakdown
        expr: dwh_health_check{kategori="pipeline", severity="3"} > 0
        for: 10m
        labels:
          severity: critical
          category: pipeline
        annotations:
          summary: "⚠️ Pipeline Kırılması — {{ $labels.kontrol_kodu }}"
          description: |
            Veri yükleme başarısız:
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}

      - alert: DWHWarningIssue
        expr: dwh_health_check{severity="2"} > 0
        for: 15m
        labels:
          severity: warning
          category: general
        annotations:
          summary: "⚠️ DWH Uyarısı — {{ $labels.kontrol_kodu }}"
          description: |
            {{ $labels.db_type }}/{{ $labels.host }}/{{ $labels.db_name }}
            Kontrol: {{ $labels.kontrol_adi }}

      - alert: DWHMultipleCategoriesCritical
        expr: count(dwh_health_check{severity="3"}) > 3
        for: 10m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🔴 SİSTEM ÇAPI KRIZ"
          description: "{{ $value }} kategori'de kritik sorun"

      - alert: DWHAllAdaptersDown
        expr: count(dwh_health_check) == 0
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "🔴 TÜM ADAPTER'LAR YANIT VERMİYOR"
          description: "Collector engine'de kritik sorun"
