# =============================================================================
# alertmanager.yml — Prometheus Alertmanager Konfigürasyonu
# =============================================================================
# Port: 9093
# Prod'da receivers altına gerçek Slack/PagerDuty/SMTP ekle.
# =============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'db_type', 'kontrol_kodu']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  # Slack örneği:
  # - name: 'slack-critical'
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/XXX'
  #       channel: '#dwh-alerts'
  #       send_resolved: true

inhibit_rules: []
