version: "3.9"
services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    volumes:
      - vault_data:/vault/data
    networks:
      - dwh-net
  postgres:
    image: postgres:16
    container_name: dq-postgres
    environment:
      POSTGRES_USER: dquser
      POSTGRES_PASSWORD: dqpass
      POSTGRES_DB: dqmetrics
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/dwh_health_log.sql:/docker-entrypoint-initdb.d/01_dwh_health_log.sql
    ports:
      - "5433:5432"
    networks:
      - dwh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dquser -d dqmetrics"]
      interval: 10s
      timeout: 5s
      retries: 5
  dwh-monitor:
    build: .
    container_name: dwh-monitor
    ports:
      - "8005:8005"
    volumes:
      - ./config:/app/config
      - ./archive:/app/archive
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dwhmonitor
      - DB_USER=dquser
      - DB_PASS=dqpass
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dwh-net
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: dwh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - dwh-net
    depends_on:
      - dwh-monitor
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:latest
    container_name: dwh-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - dwh-net
    restart: unless-stopped
networks:
  dwh-net:
    driver: bridge
volumes:
  pg_data:
  vault_data:
  prometheus_data:
  alertmanager_data:
