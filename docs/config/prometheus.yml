# =============================================================================
# prometheus.yml — Prometheus Scrape & Alerting Konfigürasyonu
# =============================================================================
# Port: 9090
# Scrape hedefi: dwh-monitor:8005/metrics (container adı kullanılır, localhost değil)
# Alert rules: /etc/prometheus/rules/dwh-health.yml
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dwh-monitor'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/rules/dwh-health.yml'

scrape_configs:

  - job_name: 'dwh-metrics'
    static_configs:
      - targets: ['dwh-monitor:8005']   # Container adı — localhost:8005 çalışmaz
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s
