global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
rule_files:
  - '/etc/prometheus/rules/dwh-health.yml'
scrape_configs:
  - job_name: 'dwh-metrics'
    static_configs:
      - targets: ['dwh-monitor:8005']
    scrape_interval: 30s
